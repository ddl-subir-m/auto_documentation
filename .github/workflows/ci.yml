name: CI

on:
  pull_request:
    branches: [feature/mrm-portal-integration]
  push:
    branches: [feature/mrm-portal-integration]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: auto_model_docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        working-directory: auto_model_docs
        env:
          # CI-only fakes so tests that touch the LLM client path don't blow up on missing env.
          # Individual tests should mock the actual LLM calls.
          ANTHROPIC_API_KEY: sk-test-dummy
          OPENAI_API_KEY: sk-test-dummy
        run: |
          pytest tests/ -x -v --tb=short
